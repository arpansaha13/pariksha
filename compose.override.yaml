services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "3000:80"
    volumes:
      - ./docker/conf/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - frontend-network

  frontend:
    networks:
      - frontend-network

  backend:
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      paper:
        condition: service_started
    networks:
      - frontend-network
      - backend-network

  auth:
    depends_on:
      db:
        condition: service_healthy
      sessionsDb:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    networks:
      - backend-network
      - auth-network

  paper:
    depends_on:
      papersDb:
        condition: service_healthy
    networks:
      - backend-network
      - papers-network

  mail:
    depends_on:
      rabbit:
        condition: service_healthy
    networks:
      - mail-network

  sessionsCron:
    depends_on:
      sessionsDb:
        condition: service_healthy
    networks:
      - auth-network

  rabbit:
    image: rabbitmq:3-management-alpine
    container_name: rabbit
    healthcheck:
      test: rabbitmq-diagnostics -q status
      interval: 15s
      timeout: 70s
      retries: 3
    volumes:
     - ./docker/data/rabbit/:/var/lib/rabbitmq/mnesia/
     - ./docker/conf/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    restart: always
    networks:
      - auth-network
      - mail-network

  db:
    image: postgres:15.10-alpine
    restart: always
    container_name: db
    env_file:
      - docker/env/pg.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    ports:
      - 6000:5432 # needed for pgAdmin
    volumes:
      - ./docker/data/db:/var/lib/postgresql/data
    networks:
      - backend-network

  usersDb:
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB_USERS}
    volumes:
      - ./docker/data/usersDb:/var/lib/postgresql/data
    networks:
      - auth-network

  sessionsDb:
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB_SESSIONS}
    volumes:
      - ./docker/data/sessionsDb:/var/lib/postgresql/data
    networks:
      - auth-network

  papersDb:
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB_PAPERS}
    volumes:
      - ./docker/data/papersDb:/var/lib/postgresql/data
    networks:
      - papers-network

networks:
  frontend-network:
    name: frontend-network
  backend-network:
    name: backend-network
  auth-network:
    name: auth-network
  mail-network:
    name: mail-network
  papers-network:
    name: papers-network
