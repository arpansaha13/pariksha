services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "3000:80"
    volumes:
      - ./docker/conf/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - frontend-network

  frontend:
    networks:
      - frontend-network

  backend:
    depends_on:
      auth:
        condition: service_started
      paper:
        condition: service_started
      exam:
        condition: service_started
    networks:
      - frontend-network
      - backend-network

  auth:
    depends_on:
      usersDb:
        condition: service_healthy
      sessionsDb:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    networks:
      - backend-network
      - auth-network

  paper:
    depends_on:
      papersDb:
        condition: service_healthy
    networks:
      - backend-network
      - papers-network

  exam:
    depends_on:
      examsDb:
        condition: service_healthy
    networks:
      - backend-network
      - exams-network

  mail:
    depends_on:
      rabbit:
        condition: service_healthy
    networks:
      - mail-network

  sessionsCron:
    depends_on:
      sessionsDb:
        condition: service_healthy
    networks:
      - auth-network

  rabbit:
    image: rabbitmq:3-management-alpine
    container_name: rabbit
    healthcheck:
      test: rabbitmq-diagnostics -q status
      interval: 15s
      timeout: 70s
      retries: 3
    volumes:
     - ./docker/data/rabbit/:/var/lib/rabbitmq/mnesia/
     - ./docker/conf/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    restart: always
    networks:
      - auth-network
      - mail-network

  usersDb:
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB_USERS}
    volumes:
      - ./docker/data/usersDb:/var/lib/postgresql/data
    networks:
      - auth-network

  sessionsDb:
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB_SESSIONS}
    volumes:
      - ./docker/data/sessionsDb:/var/lib/postgresql/data
    networks:
      - auth-network

  papersDb:
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB_PAPERS}
    volumes:
      - ./docker/data/papersDb:/var/lib/postgresql/data
    networks:
      - papers-network

  examsDb:
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB_EXAMS}
    volumes:
      - ./docker/data/examsDb:/var/lib/postgresql/data
    networks:
      - exams-network

networks:
  frontend-network:
    name: frontend-network
  backend-network:
    name: backend-network
  auth-network:
    name: auth-network
  mail-network:
    name: mail-network
  papers-network:
    name: papers-network
  exams-network:
    name: exams-network
