syntax = "proto3";

package proto;

option go_package = "/proto";

import "google/protobuf/timestamp.proto";
import "common.proto";

service ExamService {
  // Exam operations
  rpc GetUserExams(Empty) returns (ExamList) {}
  rpc CreateExam(CreateExamRequest) returns (ExamResponse) {}
  rpc UpdateExam(UpdateExamRequest) returns (ExamResponse) {}
  rpc GetExam(ExamRequest) returns (ExamResponse) {}
  rpc GetExamQuestions(ExamRequest) returns (ExamQuestionsResponse) {}
  rpc GetExamCategories(ExamRequest) returns (ExamCategoriesResponse) {}
  rpc GetExamPermission(ExamRequest) returns (ExamPermissionResponse) {}
  rpc DeleteExams(DeleteExamsRequest) returns (Empty) {}
  rpc GetExamResults(ExamRequest) returns (ExamResultsResponse) {}

  // Participant operations
  rpc GetExamParticipants(ExamRequest) returns (ParticipantList) {}
  rpc AddExamParticipant(AddParticipantRequest) returns (ParticipantResponse) {}
  rpc RemoveExamParticipant(RemoveParticipantRequest) returns (Empty) {}
  rpc StartExam(StartExamRequest) returns (Empty) {}
  rpc EndExam(EndExamRequest) returns (Empty) {}
  rpc GetExamParticipant(GetExamParticipantRequest) returns (GetExamParticipantResponse) {}
  rpc GetParticipantById(ParticipantRequest) returns (ParticipantResponse) {}

  // Answer operations
  rpc GetParticipantAnswers(ParticipantRequest) returns (AnswerList) {}
  rpc GetAnswerForExam(GetAnswerRequest) returns (AnswerMinimalResponse) {}
  rpc UpsertAnswer(UpsertAnswersRequest) returns (UpsertAnswersResponse) {}

  // Evaluation
  rpc GetAnswerEvaluationData(ParticipantQuestionRequest) returns (GetAnswerEvaluationDataResponse) {}
  rpc UpdateAnswerForEvaluation(UpdateAnswerRequest) returns (GetAnswerEvaluationDataResponse) {}
  rpc MarkParticipantAsEvaluated(ParticipantRequest) returns (EvaluationStatusResponse) {}
  rpc GetAnswerForEvaluation(ParticipantQuestionRequest) returns (AnswerMinimalResponse) {}
}

// Exam messages
message ExamRequest {
  int64 exam_id = 1;
}

message CreateExamRequest {
  string title = 1;
  google.protobuf.Timestamp starts_at = 2;
  google.protobuf.Timestamp ends_at = 3;
  int32 max_candidates_count = 4;
  optional string type = 5;
  int64 paper_id = 6;
  int32 duration_minutes = 7;
}

message UpdateExamRequest {
  int64 exam_id = 1;
  optional string title = 2;
  optional google.protobuf.Timestamp starts_at = 3;
  optional google.protobuf.Timestamp ends_at = 4;
  optional string type = 5;
  optional int32 duration_minutes = 6;
}

message ExamResponse {
  int64 id = 1;
  string title = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  int64 created_by = 5;
  string type = 6;
  int32 max_candidates_count = 7;
  ParticipantCount participant_counts = 9;
  int32 duration_minutes = 10;
  int32 max_score = 11;
}

message ExamList {
  repeated ExamResponse exams = 1;
}

message ParticipantCount {
  int32 unattended = 1;
  int32 invited = 2;
  int32 started = 3;
  int32 ended = 4;
}

// Participant messages
message ParticipantRequest {
  int64 participant_id = 1;
}

message ParticipantResponse {
  int64 id = 1;
  int64 user_id = 2;
  int32 status = 3;
  int32 score_awarded = 4;
  optional google.protobuf.Timestamp started_at = 5;
  optional google.protobuf.Timestamp ended_at = 6;
  optional google.protobuf.Timestamp scheduled_end_time = 7;
}

message ParticipantList {
  repeated ParticipantResponse participants = 1;
}

// Replace AddParticipantsRequest with AddParticipantRequest
message AddParticipantRequest {
  int64 exam_id = 1;
  int64 user_id = 2;
}

message RemoveParticipantRequest {
  int64 exam_id = 1;
  int64 participant_id = 2;
}

message StartExamRequest {
  int64 exam_id = 1;
  int32 duration_minutes = 2;
}

message EndExamRequest {
  int64 exam_id = 1;
}

message EvaluationStatusResponse {
  int32 unevaluated_count = 1;
}

// Answer messages
message Answer {
  optional bytes answer = 1;  // JSON encoded answer, can be nil
  google.protobuf.Timestamp submitted_at = 2;
  int64 question_id = 3;
}

message UpsertAnswersRequest {
  int64 exam_id = 1;
  Answer answer = 2;
}

message UpsertAnswersResponse {
  int64 answer_id = 1;
  int64 question_id = 2;
  optional bytes answer = 3;  // JSON encoded answer, can be nil
}

message AnswerResponse {
  int64 id = 1;
  int64 exam_participant_id = 2;
  int64 question_id = 3;
  bytes answer = 4;  // JSON encoded answer
  
  // question fields
  int32 order = 5;
  int64 category_id = 6;
  string question_type = 7;
  int32 max_score = 8;
}

message AnswerList {
  repeated AnswerResponse answers = 1;
}

message UpdateAnswerRequest {
  int64 answer_id = 1;
  optional int32 new_score = 2;
  optional bool evaluated = 3;
  optional string comments = 4;
}

message GetAnswerRequest {
  int64 exam_id = 1;
  int64 question_id = 2;
}

message AnswerMinimalResponse {
  int64 id = 1;
  bytes answer = 2;  // JSON encoded answer
  int64 question_id = 3;
}

message CheckParticipantRequest {
  int64 exam_id = 1;
}

message GetExamParticipantRequest {
  int64 exam_id = 1;
}

message GetExamParticipantResponse {
  int64 participant_id = 1;
  int32 score_awarded = 2;
  optional google.protobuf.Timestamp started_at = 3;
  optional google.protobuf.Timestamp scheduled_end_time = 4;
}

message ExamQuestion {
  int64 question_id = 1;
  int64 category_id = 2;
  int32 order = 3;
  string type = 4;
  int32 max_score = 5;
}

message ExamQuestionsResponse {
  repeated ExamQuestion questions = 1;
}

message ExamCategory {
  int64 category_id = 1;
  int32 order = 2;
}

message ExamCategoriesResponse {
  repeated ExamCategory categories = 1;
}

enum ExamAccessType {
  OWNER = 0;
  PARTICIPANT = 1;
}

message ExamPermissionResponse {
  bool can_read = 1;
  bool can_write = 2;
  bool can_participate = 3;
  bool can_evaluate = 4;
  optional int32 participant_status = 5;
}

message ParticipantQuestionRequest {
  int64 participant_id = 1;
  int64 question_id = 2;
}

message GetAnswerEvaluationDataResponse {
  int64 id = 1;
  int64 question_id = 2;
  int32 score_awarded = 3;
  string comments = 4;
}

message DeleteExamsRequest {
  repeated int64 exam_ids = 1;
}

message ExamResultItem {
  int64 answer_id = 1;
  int32 score_awarded = 2;
  string comments = 3;
}

message ExamResultsResponse {
  repeated ExamResultItem results = 1;
}
