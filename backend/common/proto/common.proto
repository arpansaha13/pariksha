syntax = "proto3";

package proto;

option go_package = "/proto";

message Empty {}

// Question Type enum
enum QuestionType {
  UNKNOWN_QUESTION_TYPE = 0;
  MCQ = 1;
  SUBJECTIVE = 2;
  CODING = 3;
}

// Parameter Type enum for coding-question input-definitions
enum ParameterType {
  UNKNOWN_PARAMETER_TYPE = 0;

	// Primitive
  NUMBER = 1;
  STRING = 2;
  BOOLEAN = 3;

	// Composite
  ARRAY = 4;
}
