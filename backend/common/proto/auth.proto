syntax = "proto3";

package proto;

option go_package = "/proto";

import "common.proto";
import "user.proto";

// Common error response structure
message ErrorResponse {
  int32 code = 1;        // HTTP status code
  string message = 2;    // Error message
  string details = 3;    // Optional additional error details
}

service AuthService {
  // Login with password
  rpc LoginWithPassword(LoginWithPasswordRequest) returns (UserResponse) {
    // Possible errors:
    // - INVALID_ARGUMENT (400): Invalid request body
    // - UNAUTHENTICATED (401): Invalid credentials
    // - INTERNAL (500): Failed to create session
  }

  // Login with OTP flow
  rpc InitiateLoginWithOtp(LoginWithOtpRequest) returns (Empty) {
    // Possible errors:
    // - INVALID_ARGUMENT (400): Invalid request body
    // - INTERNAL (500): Failed to create OTP
  }

  rpc VerifyLoginOtp(VerificationRequest) returns (UserResponse) {
    // Possible errors:
    // - INVALID_ARGUMENT (400): Invalid request body
    // - UNAUTHENTICATED (401): Invalid email/OTP or user not verified
    // - INTERNAL (500): Failed to create session
  }

  // Signup flow
  rpc SignUp(SignUpRequest) returns (Empty) {
    // Possible errors:
    // - INVALID_ARGUMENT (400): Invalid request body
    // - ALREADY_EXISTS (409): Email already registered
    // - INTERNAL (500): Failed to process signup
  }

  rpc VerifySignup(VerificationRequest) returns (UserResponse) {
    // Possible errors:
    // - INVALID_ARGUMENT (400): Invalid request body
    // - UNAUTHENTICATED (401): Invalid email or OTP
    // - INTERNAL (500): Failed to verify user or create session
  }

  // Password reset flow
  rpc ForgotPassword(ForgotPasswordRequest) returns (Empty) {
    // Possible errors:
    // - INVALID_ARGUMENT (400): Invalid request body
    // - NOT_FOUND (404): Email not found or not verified
    // - INTERNAL (500): Failed to create OTP
  }

  rpc ResetPassword(ResetPasswordRequest) returns (Empty) {
    // Possible errors:
    // - INVALID_ARGUMENT (400): Invalid request body
    // - UNAUTHENTICATED (401): Invalid OTP or old password
    // - NOT_FOUND (404): User not found
    // - INTERNAL (500): Failed to reset password
  }

  // Authenticate session
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse) {
    // Possible errors:
    // - INVALID_ARGUMENT (400): Missing session key or CSRF token
    // - UNAUTHENTICATED (401): Invalid or expired session
  }

  // User operations
  rpc GetUser(GetUserRequest) returns (UserProfileResponse) {}
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {}
  rpc UpsertUser(UpsertUserRequest) returns (UserProfileResponse) {}

  // Logout invalidates the current session
  rpc Logout(LogoutRequest) returns (Empty) {
    // Possible errors:
    // - INVALID_ARGUMENT (400): Session key is required
    // - NOT_FOUND (404): Session not found
    // - INTERNAL (500): Failed to invalidate session
  }
}

message LoginWithPasswordRequest {
  string email = 1;
  string password = 2;
}

message LoginWithOtpRequest {
  string email = 1;
}

message SignUpRequest {
  string email = 1;
  string password = 2;
}

message VerificationRequest {
  string email = 1;
  string otp = 2;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ResetPasswordRequest {
  string email = 1;
  string new_password = 2;
  string otp = 3;
}

message UserResponse {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
}

message AuthenticateRequest {
  string session_key = 1;
  string csrf_token = 2;
}

message AuthenticateResponse {
  int64 user_id = 1;
}

message UpsertUserRequest {
  string email = 1;
  optional string first_name = 2;
  optional string last_name = 3;
}

message LogoutRequest {
  string session_key = 1;
}