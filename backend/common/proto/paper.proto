syntax = "proto3";

package proto;

option go_package = "/proto";

import "common.proto";

service PaperService {
  // Paper operations
  rpc GetUserPapers(Empty) returns (PaperList) {}
  rpc GetPaper(PaperRequest) returns (PaperResponse) {}
  rpc CreatePaper(Empty) returns (PaperResponse) {}
  rpc UpdatePaper(UpdatePaperRequest) returns (Empty) {}
  rpc CheckPaperAccess(PaperRequest) returns (Empty) {}

  // Question operations
  rpc GetPaperQuestions(PaperRequest) returns (QuestionList) {}
  rpc GetQuestion(QuestionRequest) returns (QuestionResponse) {}
  rpc CreateQuestion(CreateQuestionRequest) returns (QuestionResponse) {}
  rpc UpdateQuestion(UpdateQuestionRequest) returns (Empty) {}
  rpc DeleteQuestion(QuestionRequest) returns (Empty) {}
  rpc ReorderQuestions(ReorderQuestionsRequest) returns (Empty) {}

  // Category operations
  rpc GetPaperCategories(PaperRequest) returns (CategoryList) {}
  rpc CreateCategory(CreateCategoryRequest) returns (CategoryResponse) {}
  rpc UpdateCategory(UpdateCategoryRequest) returns (Empty) {}
  rpc DeleteCategory(CategoryRequest) returns (Empty) {}
  rpc ReorderCategories(ReorderCategoriesRequest) returns (Empty) {}

  // Exam operations
  rpc GetQuestionsByIds(GetQuestionsByIdsRequest) returns (QuestionBatchResponse) {}
  rpc GetCategoriesByIds(GetCategoriesByIdsRequest) returns (CategoryBatchResponse) {}
  rpc GetExamQuestion(QuestionRequest) returns (QuestionResponse) {}
}

// Paper messages
message PaperRequest {
  int64 paper_id = 1;
}

message PaperResponse {
  int64 id = 1;
  string title = 2;
  int32 max_score = 3;
  int32 duration_minutes = 4;
  QuestionCount question_counts = 5;
  int64 created_by = 6;
}

message PaperList {
  repeated PaperResponse papers = 1;
}

message UpdatePaperRequest {
  int64 paper_id = 1;
  optional string title = 2;
  optional int32 duration_minutes = 3;
}

message QuestionCount {
  int32 mcq = 1;
  int32 short = 2;
  int32 long = 3;
}

// Question messages
message QuestionRequest {
  int64 question_id = 1;
}

message QuestionResponse {
  int64 id = 1;
  oneof question {
    McqQuestion mcq = 2;
    GeneralQuestion general = 3;
  }
  int64 category_id = 4;
  string type = 5;
  repeated string tags = 6;
  int64 paper_id = 7;
  int32 max_score = 8;
  optional string correct_answer = 9;
}

message QuestionList {
  repeated QuestionMinimal questions = 1;
}

message QuestionMinimal {
  int64 id = 1;
  int64 category_id = 2;
  int64 paper_id = 3;
  int32 order = 4;
  oneof question {
    McqQuestion mcq = 5;
    GeneralQuestion general = 6;
  }
}

message McqQuestion {
  string statement = 1;
  repeated string options = 2;
}

message GeneralQuestion {
  string statement = 1;
}

message CreateQuestionRequest {
  int64 paper_id = 1;
  bytes raw_question = 2;
  int64 category_id = 3;
  string type = 4;
  repeated string tags = 5;
  int32 max_score = 6;
  optional string correct_answer = 7;
}

message UpdateQuestionRequest {
  int64 question_id = 1;
  optional string type = 2;
  optional bytes raw_question = 3;
  optional int64 category_id = 4;
  optional int32 max_score = 5;
  repeated string tags = 6;
  optional string correct_answer = 7;
}

message ReorderQuestionsRequest {
  int64 category_id = 1;
  repeated int64 question_ids = 2;
}

message GetQuestionsByIdsRequest {
  repeated int64 question_ids = 1;
}

message QuestionBatchResponse {
  repeated QuestionBatchItem questions = 1;
}

message QuestionBatchItem {
  int64 id = 1;
  oneof question {
    McqQuestion mcq = 2;
    GeneralQuestion general = 3;
  }
  int32 max_score = 4;
  string type = 6;
}

// Category messages
message GetCategoriesByIdsRequest {
  repeated int64 category_ids = 1;
}

message CategoryBatchResponse {
  repeated CategoryBatchItem categories = 1;
}

message CategoryBatchItem {
  int64 id = 1;
  string name = 2;
}

message CategoryRequest {
  int64 category_id = 1;
}

message CategoryResponse {
  int64 id = 1;
  string name = 2;
  int32 order = 3;
}

message CategoryList {
  repeated CategoryResponse categories = 1;
}

message CreateCategoryRequest {
  int64 paper_id = 1;
}

message UpdateCategoryRequest {
  int64 category_id = 1;
  string name = 2;
}

message ReorderCategoriesRequest {
  int64 paper_id = 1;
  repeated int64 category_ids = 2;
}
