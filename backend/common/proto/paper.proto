syntax = "proto3";

package proto;

option go_package = "/proto";

import "common.proto";

service Paper {
  // Paper operations
  rpc GetUserPapers(Empty) returns (PaperList) {}
  rpc GetPaper(PaperRequest) returns (PaperResponse) {}
  rpc CreatePaper(Empty) returns (PaperResponse) {}
  rpc UpdatePaper(UpdatePaperRequest) returns (Empty) {}
  rpc DeletePapers(DeletePapersRequest) returns (Empty) {}
  rpc GetPaperPermissions(PaperRequest) returns (PaperPermissionsResponse) {}

  // Question operations
  rpc GetPaperQuestions(PaperRequest) returns (QuestionList) {}
  rpc GetPaperQuestion(QuestionRequest) returns (QuestionResponse) {}
  rpc CreateQuestion(CreateQuestionRequest) returns (CreateQuestionResponse) {}
  rpc UpdateQuestion(UpdateQuestionRequest) returns (UpdateQuestionResponse) {}
  rpc DeleteQuestion(QuestionRequest) returns (Empty) {}
  rpc ReorderQuestions(ReorderQuestionsRequest) returns (Empty) {}

  // Category operations
  rpc GetPaperCategories(PaperRequest) returns (CategoryList) {}
  rpc CreateCategory(CreateCategoryRequest) returns (CategoryResponse) {}
  rpc UpdateCategory(UpdateCategoryRequest) returns (Empty) {}
  rpc DeleteCategory(CategoryRequest) returns (Empty) {}
  rpc ReorderCategories(ReorderCategoriesRequest) returns (Empty) {}

  // Exam operations
  rpc GetQuestionsByIds(GetQuestionsByIdsRequest)
      returns (GetQuestionsByIdsResponse) {}
  rpc GetCategoriesByIds(GetCategoriesByIdsRequest)
      returns (CategoryBatchResponse) {}
  rpc GetExamQuestionByHash(QuestionRequest) returns (ExamQuestionResponse) {}
  rpc GetQuestionHashes(GetQuestionHashesRequest)
      returns (GetQuestionHashesResponse) {}
  rpc GetQuestionIds(GetQuestionIdsRequest) returns (GetQuestionIdsResponse) {}

  // Boilerplate operations
  rpc GetBoilerplate(GetBoilerplateRequest) returns (GetBoilerplateResponse) {}

  // Test Case operations
  rpc UpsertPaperTestCases(UpsertTestCasesRequest) returns (Empty) {}

  // Coding Question Input Definitions
  rpc GetCodingQuestionInputDefinitions(
      GetCodingQuestionInputDefinitionsRequest)
      returns (GetCodingQuestionInputDefinitionsResponse) {}
}

// Paper messages
message PaperRequest { string paper_hash = 1; }

message PaperResponse {
  string paper_hash = 1;
  string title = 2;
  int32 max_score = 3;
  int32 duration_minutes = 4;
  QuestionCount question_counts = 5;
  int64 created_by = 6;
}

message PaperList { repeated PaperResponse papers = 1; }

message UpdatePaperRequest {
  string paper_hash = 1;
  optional string title = 2;
  optional int32 duration_minutes = 3;
}

message QuestionCount {
  int32 mcq = 1;
  int32 subjective = 2;
  int32 coding = 3;
}

message DeletePapersRequest { repeated string paper_hashes = 1; }

// Question messages
message QuestionRequest { string question_hash = 1; }

message QuestionResponse {
  string question_hash = 1;
  bytes raw_question = 2;
  int64 category_id = 4;
  QuestionType type = 5;
  repeated string tags = 6;
  string paper_hash = 7;
  int32 max_score = 8;
  optional string correct_answer = 9;
  repeated CodingQuestionTestCase test_cases = 10;
}

message QuestionList { repeated QuestionMinimal questions = 1; }

message QuestionMinimal {
  string question_hash = 1;
  int64 category_id = 2;
  string paper_hash = 3;
  int32 order = 4;
  bytes raw_question = 5;
}

message CreateQuestionRequest {
  string paper_hash = 1;
  bytes raw_question = 2;
  int64 category_id = 3;
  QuestionType type = 4;
  repeated string tags = 5;
  int32 max_score = 6;
  optional string correct_answer = 7;
}

message CreateQuestionResponse { string question_hash = 1; }

message UpdateQuestionRequest {
  string question_hash = 1;
  optional QuestionType type = 2;
  optional bytes raw_question = 3;
  optional int32 max_score = 4;
  repeated string tags = 5;
  optional string correct_answer = 6;
}

message UpdateQuestionResponse { string question_hash = 1; }

message ReorderQuestionsRequest {
  int64 category_id = 1;
  repeated string question_hashes = 2;
}

message GetQuestionsByIdsRequest {
  // Internal handler for exam service. IDs can be allowed.
  repeated int64 question_ids = 1;
}

message GetQuestionsByIdsResponse { repeated QuestionBatchItem questions = 1; }

message QuestionBatchItem {
  int64 question_id = 1;
  string question_hash = 2;
  bytes raw_question = 3;
  int32 max_score = 4;
  QuestionType type = 5;
}

// Category messages
message GetCategoriesByIdsRequest { repeated int64 category_ids = 1; }

message CategoryBatchResponse { repeated CategoryBatchItem categories = 1; }

message CategoryBatchItem {
  int64 category_id = 1;
  string name = 2;
}

message CategoryRequest { int64 category_id = 1; }

message CategoryResponse {
  int64 category_id = 1;
  string name = 2;
  int32 order = 3;
}

message CategoryList { repeated CategoryResponse categories = 1; }

message CreateCategoryRequest { string paper_hash = 1; }

message UpdateCategoryRequest {
  int64 category_id = 1;
  string name = 2;
}

message ReorderCategoriesRequest {
  string paper_hash = 1;
  repeated int64 category_ids = 2;
}

message PaperPermissionsResponse {
  bool can_read = 1;
  bool can_write = 2;
}

// Boilerplate messages
message GetBoilerplateRequest {
  string question_hash = 1;
  int32 language_id = 2;
}

message GetBoilerplateResponse { string code = 1; }

message UpsertTestCase {
  repeated string inputs = 2;
  string output = 3;
  optional string explanation = 4;
  bool hidden = 5;
}

message UpsertTestCasesRequest {
  string question_hash = 1;
  repeated UpsertTestCase test_cases = 2;
}

message GetQuestionHashesRequest { repeated int64 question_ids = 1; }

message GetQuestionHashesResponse { repeated string question_hashes = 1; }

message GetQuestionIdsRequest { repeated string question_hashes = 1; }

message GetQuestionIdsResponse { repeated int64 question_ids = 1; }

// Coding Question Input Definitions
message GetCodingQuestionInputDefinitionsRequest { string question_hash = 1; }

message GetCodingQuestionInputDefinitionsResponse {
  repeated InputDefinition input_definitions = 1;
}

message InputDefinition {
  string variable_name = 1;
  ParameterType type = 2;
  repeated ParameterItem items = 3;
}

message ParameterItem {
  optional string property_name = 1;
  ParameterType type = 2;
}