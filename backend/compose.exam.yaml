services:
  exam:
    build:
      context: .
      dockerfile: ./exam/Dockerfile
    image: pariksha_exam_service
    container_name: exam_service
    env_file:
      - /exam/env/.env
    develop:
      watch:
        - action: rebuild
          path: ./exam/internal
        - action: rebuild
          path: ./exam/cmd
        - action: rebuild
          path: ./common
        - action: rebuild
          path: ./exam/go.mod
        - action: rebuild
          path: ./exam/go.sum

  examsDb:
    image: postgres:15.10-alpine
    restart: always
    container_name: exams_db
    env_file:
      - ./exam/env/examsDb.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_EXAMS}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    ports:
      - 6040:5432 # needed for pgAdmin

  examQueue:
    image: rabbitmq:3-management-alpine
    container_name: exam_queue
    healthcheck:
      test: rabbitmq-diagnostics -q status
      interval: 15s
      timeout: 70s
      retries: 3
    restart: always
