services:
  examWorker:
    build:
      context: .
      dockerfile: ./workers/exam/Dockerfile
    image: pariksha_exam_worker
    container_name: exam_worker
    env_file:
      - ./workers/exam/.env
    develop:
      watch:
        - action: rebuild
          path: ./workers/exam/internal
        - action: rebuild
          path: ./workers/exam/cmd
        - action: rebuild
          path: ./backend/common
        - action: rebuild
          path: ./workers/exam/go.mod
        - action: rebuild
          path: ./workers/exam/go.sum
