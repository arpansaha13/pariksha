# Default values for pariksha

# Global configuration
global:
  environment: development
  imagePullPolicy: Never
  imageRegistry: ""
  imageTag: "latest"

# External Secrets configuration
externalSecrets:
  enabled: true
  vault:
    name: vault-backend
    server: "http://host.docker.internal:8200"
    path: "pariksha"
    version: "v2"

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: localhost
      paths:
        - path: /api/_nuxt_icon/
          pathType: Prefix
        - path: /api/
          pathType: Prefix
        - path: /_nuxt/hmr/
          pathType: Prefix
        - path: /
          pathType: Prefix

# NodePort service configuration
nodeport:
  enabled: true
  port: 80
  targetPort: 80
  nodePort: 30000

# Frontend (Client) configuration
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: pariksha_frontend
    tag: "latest"
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  config:
    NUXT_API_BASE_URL: "http://gateway-service:4000"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Gateway configuration
gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: pariksha_backend
    tag: "latest"
  service:
    type: ClusterIP
    port: 4000
    targetPort: 4000
  config:
    GO_ENV: "development"
    API_PORT: "4000"
    AUTH_SERVER_HOST: "host.docker.internal"
    AUTH_SERVER_PORT: "4000"
    PAPER_SERVER_HOST: "paper-service"
    PAPER_SERVER_PORT: "4000"
    EXAM_SERVER_HOST: "exam-service"
    EXAM_SERVER_PORT: "4000"
    ENGINE_SERVER_HOST: "engine-service"
    ENGINE_SERVER_PORT: "4000"
    CLIENT_URL: "https://localhost/3000"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Exam service configuration
exam:
  enabled: true
  replicaCount: 1
  image:
    repository: pariksha_exam_service
    tag: "latest"
  service:
    type: ClusterIP
    port: 4000
    targetPort: 4000
  config:
    GO_ENV: "development"
    EXAM_SERVER_PORT: "4000"
    EXAM_DB_HOST: "external-exam-db-service"
    EXAM_DB_NAME: "db_pariksha_exams"
    EXAM_DB_PORT: "6030"
    EXAM_DB_SSLMODE: "disable"
    PAPER_SERVER_HOST: "paper-service"
    PAPER_SERVER_PORT: "4000"
    QUESTION_SERVER_HOST: "question-service"
    QUESTION_SERVER_PORT: "4000"
    EXAM_QUEUE_HOST: "commonQueue"
    EXAM_QUEUE_PORT: "6379"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Exam database configuration
examDb:
  enabled: true
  externalName: "host.docker.internal"

# Exam queue (Redis) configuration
examQueue:
  enabled: true
  replicaCount: 1
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Paper service configuration
paper:
  enabled: true
  replicaCount: 1
  image:
    repository: pariksha_paper_service
    tag: "latest"
  service:
    type: ClusterIP
    port: 4000
    targetPort: 4000
  config:
    GO_ENV: "development"
    PAPER_SERVER_PORT: "4000"
    PAPER_DB_HOST: "external-paper-db-service"
    PAPER_DB_NAME: "db_pariksha_papers"
    PAPER_DB_PORT: "6020"
    PAPER_DB_SSLMODE: "disable"
    QUESTION_SERVER_HOST: "question-service"
    QUESTION_SERVER_PORT: "4000"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Paper database configuration
paperDb:
  enabled: true
  externalName: "host.docker.internal"

# Question service configuration
question:
  enabled: true
  replicaCount: 1
  image:
    repository: pariksha_question_service
    tag: "latest"
  service:
    type: ClusterIP
    port: 4000
    targetPort: 4000
  config:
    GO_ENV: "development"
    QUESTION_SERVER_PORT: "4000"
    QUESTION_DB_HOST: "external-question-db-service"
    QUESTION_DB_NAME: "db_pariksha_questions"
    QUESTION_DB_PORT: "6040"
    QUESTION_DB_SSLMODE: "disable"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Question database configuration
questionDb:
  enabled: true
  externalName: "host.docker.internal"

# Engine service configuration
engine:
  enabled: true
  replicaCount: 1
  image:
    repository: pariksha_engine_service
    tag: "latest"
  service:
    type: ClusterIP
    port: 4000
    targetPort: 4000
  config:
    GO_ENV: "development"
    ENGINE_SERVER_PORT: "4000"
    QUESTION_SERVER_HOST: "question-service"
    QUESTION_SERVER_PORT: "4000"
    DOCKER_API_VERSION: "1.38"
    HOST_TMP_MOUNT_PATH: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Worker configuration
examWorker:
  enabled: true
  replicaCount: 1
  image:
    repository: pariksha_exam_worker
    tag: "latest"
  service:
    port: 4000
    targetPort: 4000
  config:
    GO_ENV: "development"
    EXAM_DB_HOST: "external-exam-db-service"
    EXAM_DB_NAME: "db_pariksha_exams"
    EXAM_DB_PORT: "6030"
    EXAM_DB_SSLMODE: "disable"
    EXAM_QUEUE_HOST: "exam-queue-service"
    EXAM_QUEUE_PORT: "6379"
    PAPER_SERVER_HOST: "paper-service"
    PAPER_SERVER_PORT: "4000"
    QUESTION_SERVER_HOST: "question-service"
    QUESTION_SERVER_PORT: "4000"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
