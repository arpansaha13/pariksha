{{- if .Values.questionDb.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: external-question-db-service
  labels:
    app: question
    component: api
    tier: database
    environment: {{ .Values.global.environment }}
spec:
  type: ExternalName
  externalName: {{ .Values.questionDb.externalName }}
{{- end }}
