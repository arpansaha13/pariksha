{{- if .Values.question.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: question-deployment
  labels:
    app: question
    component: api
    tier: backend
    environment: {{ .Values.global.environment }}
spec:
  replicas: {{ .Values.question.replicaCount }}
  selector:
    matchLabels:
      app: question
      component: api
      tier: backend
      environment: {{ .Values.global.environment }}
  template:
    metadata:
      labels:
        app: question
        component: api
        tier: backend
        environment: {{ .Values.global.environment }}
    spec:
      {{- if .Values.questionDb.enabled }}
      initContainers:
        - name: wait-for-question-db
          image: busybox
          command:
            - sh
            - -c
            - |
              until nc -z external-question-db-service {{ .Values.question.config.QUESTION_DB_PORT }}; do
                echo "Waiting for PostgreSQL...";
                sleep 4;
              done
      {{- end }}
      containers:
        - name: question
          image: {{ .Values.question.image.repository }}:{{ .Values.question.image.tag }}
          envFrom:
            - configMapRef:
                name: question-config
            - secretRef:
                name: question-secret
          ports:
            - containerPort: {{ .Values.question.service.targetPort }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- with .Values.question.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.question.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.question.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.question.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
