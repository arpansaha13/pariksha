{{- if .Values.question.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: question-secret
  labels:
    app: question
    component: secrets
    tier: backend
    environment: {{ .Values.global.environment }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.question.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
