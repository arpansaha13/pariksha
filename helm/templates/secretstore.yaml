{{- if .Values.externalSecrets.enabled -}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.vault.name }}
  namespace: external-secrets
  labels:
    app: pariksha
    component: secretstore
    environment: {{ .Values.global.environment }}
spec:
  provider:
    vault:
      server: {{ .Values.externalSecrets.vault.server | quote }}
      path: {{ .Values.externalSecrets.vault.path | quote }}
      version: {{ .Values.externalSecrets.vault.version | quote }}
      auth:
        kubernetes:
          mountPath: "pariksha-kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
{{- end }}
