{{- if .Values.examWorker.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: exam-worker-externalsecret
  labels:
    app: exam-worker
    component: externalsecret
    tier: backend
    environment: {{ .Values.global.environment }}
spec:
  refreshPolicy: Periodic
  refreshInterval: 2h
  secretStoreRef:
    name: {{ .Values.externalSecrets.vault.name }}
    kind: ClusterSecretStore
  target:
    name: exam-worker-secret
    creationPolicy: Owner
  data:
    - secretKey: EXAM_DB_USER
      remoteRef:
        key: exam
        property: db-user
    - secretKey: EXAM_DB_PASS
      remoteRef:
        key: exam
        property: db-pass
    - secretKey: EXAM_DB_ADDR
      remoteRef:
        key: exam
        property: db-addr
    - secretKey: EXAM_API_TOKEN
      remoteRef:
        key: exam
        property: api-token
{{- end }}
