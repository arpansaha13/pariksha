{{- if .Values.exam.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: exam-config
  labels:
    app: exam
    component: config
    tier: backend
    environment: {{ .Values.global.environment }}
data:
  {{- range $key, $value := .Values.exam.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
