{{- if .Values.examQueue.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: exam-queue-service
  labels:
    app: exam-queue
    component: broker
    tier: backend
    environment: {{ .Values.global.environment }}
spec:
  type: {{ .Values.examQueue.service.type }}
  ports:
    - port: {{ .Values.examQueue.service.port }}
      targetPort: {{ .Values.examQueue.service.targetPort }}
  selector:
    app: exam-queue
    component: broker
    tier: backend
    environment: {{ .Values.global.environment }}
{{- end }}
