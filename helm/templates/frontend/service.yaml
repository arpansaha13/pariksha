{{- if .Values.frontend.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: client-service
  labels:
    app: client
    component: frontend
    tier: frontend
    environment: {{ .Values.global.environment }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: entrypoint
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
  selector:
    app: client
    component: frontend
    tier: frontend
    environment: {{ .Values.global.environment }}
{{- end }}
