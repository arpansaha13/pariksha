{{- if .Values.gateway.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels:
    app: gateway
    component: api
    tier: backend
    environment: {{ .Values.global.environment }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: entrypoint
      port: {{ .Values.gateway.service.port }}
      targetPort: {{ .Values.gateway.service.targetPort }}
  selector:
    app: gateway
    component: api
    tier: backend
    environment: {{ .Values.global.environment }}
{{- end }}
