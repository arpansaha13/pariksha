{{- if .Values.gateway.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  labels:
    app: gateway
    component: config
    tier: backend
    environment: {{ .Values.global.environment }}
data:
  {{- range $key, $value := .Values.gateway.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
